<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhe seu pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
body{background:#F7F5F2}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 50px}
.loja{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.loja .lg{width:52px;height:52px;border-radius:14px;object-fit:cover;background:var(--escuro);color:#FFB547;display:grid;place-items:center;font-weight:800}
.loja h1{font-size:1.15rem;color:var(--escuro)}
.loja small{color:var(--cinza)}
.status{background:#fff;border-radius:24px;padding:22px;text-align:center;margin-bottom:14px;border:1px solid var(--linha)}
.status .ic{font-size:3rem;margin-bottom:4px}
.status h2{font-size:1.35rem;color:var(--escuro);letter-spacing:-.02em}
.status p{color:var(--cinza)}
.linha-t{display:flex;justify-content:space-between;margin:22px 4px 4px;position:relative}
.linha-t::before{content:"";position:absolute;left:18px;right:18px;top:15px;height:4px;background:var(--linha);border-radius:4px}
.linha-t .barra{position:absolute;left:18px;top:15px;height:4px;background:var(--verde);border-radius:4px;transition:width .6s}
.passo{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:25%}
.passo .b{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--linha);display:grid;place-items:center;font-size:.9rem;transition:.3s}
.passo.ok .b{background:var(--verde);border-color:var(--verde);color:#fff}
.passo.at .b{border-color:var(--verde);animation:pul 1.5s infinite}
@keyframes pul{50%{box-shadow:0 0 0 6px rgba(31,175,90,.18)}}
.passo small{font-size:.72rem;font-weight:700;color:var(--cinza);text-align:center}
.passo.ok small,.passo.at small{color:var(--escuro)}
.i{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:.92rem}
.ad{color:var(--cinza);font-size:.82rem;padding-left:14px}
.tot{font-weight:800;color:var(--escuro);border-top:1px dashed var(--linha);margin-top:8px;padding-top:10px}
.pix{background:#fff;border-radius:24px;padding:20px;text-align:center;margin-bottom:14px;border:2px solid #32BCAD}
.pix h3{color:var(--escuro);font-size:1.1rem;margin-bottom:2px}
.pix .val{font-size:1.6rem;font-weight:800;color:var(--escuro);letter-spacing:-.02em}
.pix img{width:210px;height:210px;margin:10px auto;image-rendering:pixelated;border-radius:12px}
.pix .cod{font-size:.72rem;color:var(--cinza);word-break:break-all;background:#F7F5F2;border-radius:12px;padding:8px 10px;margin:6px 0 10px;max-height:58px;overflow:hidden}
.pix small{color:var(--cinza);display:block;margin-top:8px;font-size:.8rem}
</style>
</head>
<body>
<div class="carregando" id="carregando"><div class="giro"></div></div>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import { db, F, $, R, esc, fmtTel, ms, horaBR, dataBR, zapLink, textoPedido, linkLoja } from "./js/base.js";
const q = new URLSearchParams(location.search), l = q.get("l"), p = q.get("p");
let loja, ped, enviou = false;
const PASSOS = { novo: 0, preparo: 1, entrega: 2, pronto: 2, concluido: 3 };
function falha(t) { $("#carregando")?.remove(); $("#app").innerHTML = `<div class="vazio"><div class="ic">🔎</div><b>${t}</b></div>`; }
(async () => {
  if (!l || !p) return falha("Pedido não encontrado");
  try {
    loja = (await F.getDoc(F.doc(db, "lojas", l))).data();
    if (!loja) return falha("Pedido não encontrado");
    document.documentElement.style.setProperty("--cor", loja.cor || "#FF5A1F");
    F.onSnapshot(F.doc(db, "lojas", l, "pedidos", p), s => {
      if (!s.exists()) return falha("Pedido não encontrado");
      ped = s.data({ serverTimestamps: "estimate" });
      desenha();
      if (q.get("z") === "1" && !enviou) {
        enviou = true;
        // reforço: avisa o celular da loja (o servidor só manda 1 aviso por pedido)
        try { if (window.PEDEKI.worker) fetch(window.PEDEKI.worker.replace(/\/$/, "") + "/push/pedido", { method: "POST", keepalive: true, headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ uid: l, pid: p }) }).catch(() => {}); } catch {}
        try { history.replaceState(null, "", location.pathname + `?l=${encodeURIComponent(l)}&p=${encodeURIComponent(p)}`); } catch {}
        setTimeout(() => { location.href = linkZap(); }, 900);
      }
    }, () => falha("Não foi possível carregar o pedido"));
  } catch { falha("Não foi possível carregar o pedido"); }
})();
// ===== Pix com o valor certinho (QR Code + copia e cola)
function chavePixNormal(k) {
  k = String(k || "").trim();
  if (!k) return null;
  if (k.includes("@")) return k.toLowerCase();
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k)) return k.toLowerCase();
  const d = k.replace(/\D/g, "");
  const pareceTel = /^\+|\(/.test(k), pareceDoc = /\d\.\d|\d\/\d/.test(k);
  if (d.length === 14 && !pareceTel) return d;
  if ((d.length === 12 || d.length === 13) && d.startsWith("55")) return "+" + d;
  if (d.length === 11 && pareceDoc) return d;
  if (d.length === 11 && !pareceTel && cpfOk(d)) return d;
  if (d.length === 10 || d.length === 11) return "+55" + d;
  return null;
}
function cpfOk(c) {
  if (/^(\d)\1+$/.test(c)) return false;
  for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += +c[i] * (t + 1 - i); if (((10 * s) % 11) % 10 !== +c[t]) return false; }
  return true;
}
const limpo = (s, n) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/[^A-Z0-9 ]/g, "").replace(/\s+/g, " ").trim().slice(0, n);
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, "0");
}
function pixCodigo(chave, nome, valor, ref) {
  const f = (id, v) => id + String(v.length).padStart(2, "0") + v;
  const p = f("00", "01") + f("26", f("00", "br.gov.bcb.pix") + f("01", chave)) + f("52", "0000") + f("53", "986") +
    (valor > 0 ? f("54", valor.toFixed(2)) : "") + f("58", "BR") + f("59", limpo(nome, 25) || "LOJA") + f("60", "BRASIL") +
    f("62", f("05", (limpo(ref, 25).replace(/ /g, "") || "***"))) + "6304";
  return p + crc16(p);
}
let codigoPix = "";
function blocoPix() {
  codigoPix = "";
  if (!/pix/i.test(ped.pagamento || "") || !loja.chavePix || ["cancelado", "concluido"].includes(ped.status)) return "";
  const chave = chavePixNormal(loja.chavePix);
  if (!chave || !window.qrcode) return `<div class="pix"><h3>💠 Pague com Pix</h3><div class="val">${R(ped.total)}</div><div class="cod" style="max-height:none">Chave Pix: <b>${esc(loja.chavePix)}</b></div><button class="btn btn-sec btn-mini" data-copia="${esc(loja.chavePix)}">📋 Copiar chave</button><small>Depois, mande o comprovante no WhatsApp da loja.</small></div>`;
  codigoPix = pixCodigo(chave, loja.nome, Math.round(ped.total * 100) / 100, "PEDIDO" + ped.numero);
  let img = "";
  try { const q = qrcode(0, "M"); q.addData(codigoPix); q.make(); img = `<img src="${q.createDataURL(6, 2)}" alt="QR Code Pix">`; } catch {}
  return `<div class="pix"><h3>💠 Pague com Pix</h3><div class="val">${R(ped.total)}</div>${img}
    <div class="cod">${esc(codigoPix)}</div>
    <button class="btn btn-pri btn-bloco" data-copia="1" style="background:#32BCAD">📋 Copiar código Pix (copia e cola)</button>
    <small>Abra o app do seu banco, escolha <b>Pix copia e cola</b> e cole o código. O valor já vem certinho.<br>Depois, mande o comprovante no WhatsApp da loja.</small></div>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copia]"); if (!b) return;
  const t = b.dataset.copia === "1" ? codigoPix : b.dataset.copia;
  try { await navigator.clipboard.writeText(t); b.textContent = "✓ Copiado!"; } catch { prompt("Copie o código:", t); }
});
const linkZap = () => zapLink(loja.whatsapp, textoPedido(ped, loja, location.href.split("&z=")[0]));
function desenha() {
  $("#carregando")?.remove();
  const ret = ped.tipo !== "entrega";
  const info = {
    novo: ["📨", "Pedido enviado!", "Aguardando a loja confirmar. Se ainda não mandou, toque no botão verde abaixo."],
    preparo: ["👨‍🍳", "Em preparo", "A loja confirmou e já está preparando seu pedido."],
    entrega: ["🛵", "Saiu para entrega", "Seu pedido está a caminho!"],
    pronto: ["✅", "Pronto para retirar", "Pode buscar seu pedido na loja."],
    concluido: ["🎉", "Pedido concluído", "Obrigado pela preferência! Bom apetite."],
    cancelado: ["😔", "Pedido cancelado", "Fale com a loja pelo WhatsApp se tiver dúvidas."]
  }[ped.status] || ["📦", "Pedido", ""];
  const at = PASSOS[ped.status] ?? -1;
  const nomes = ["Recebido", "Em preparo", ret ? "Pronto" : "A caminho", "Entregue"];
  const ic = ["📨", "👨‍🍳", ret ? "✅" : "🛵", "🎉"];
  $("#app").innerHTML = `
    <div class="loja">${loja.logo ? `<img class="lg" src="${loja.logo}" alt="">` : `<div class="lg">${esc(loja.nome.slice(0, 2).toUpperCase())}</div>`}<div><h1>${esc(loja.nome)}</h1><small>Pedido #${ped.numero} · ${horaBR(ms(ped.criadoEm))} ${dataBR(ms(ped.criadoEm))}</small></div></div>
    <div class="status"><div class="ic">${info[0]}</div><h2>${info[1]}</h2><p>${info[2]}</p>
      ${ped.status === "cancelado" ? "" : `<div class="linha-t"><div class="barra" style="width:calc(${Math.max(0, at) / 3 * 100}% - ${Math.max(0, at) / 3 * 36}px)"></div>${nomes.map((n, i) => `<div class="passo ${i < at || ped.status === "concluido" ? "ok" : i === at ? "at" : ""}"><div class="b">${i < at || ped.status === "concluido" ? "✓" : ic[i]}</div><small>${n}</small></div>`).join("")}</div>`}
    </div>
    ${blocoPix()}
    <a class="btn btn-zap btn-bloco" style="padding:15px;margin-bottom:14px" href="${linkZap()}">💬 ${ped.status === "novo" ? "Enviar pedido no WhatsApp" : "Falar com a loja"}</a>
    <div class="card">
      <h3>Resumo</h3>
      ${ped.itens.map(i => `<div class="i"><span><b>${i.qtd}x</b> ${esc(i.nome)}</span><span>${R(i.unit * i.qtd)}</span></div>${(i.adicionais || []).map(a => `<div class="ad">+ ${esc(a.nome)}</div>`).join("")}${i.obs ? `<div class="ad">📝 ${esc(i.obs)}</div>` : ""}`).join("")}
      <div class="i" style="color:var(--cinza);margin-top:6px"><span>Subtotal</span><span>${R(ped.subtotal)}</span></div>
      ${!ret ? `<div class="i" style="color:var(--cinza)"><span>Entrega</span><span>${ped.taxa ? R(ped.taxa) : "Grátis"}</span></div>` : ""}
      ${ped.desconto ? `<div class="i" style="color:var(--verde)"><span>Cupom ${esc(ped.cupom)}</span><span>-${R(ped.desconto)}</span></div>` : ""}
      <div class="i tot"><span>Total</span><span>${R(ped.total)}</span></div>
      <p style="color:var(--cinza);font-size:.88rem;margin-top:10px">💳 ${esc(ped.pagamento)}${ped.troco ? " · troco para " + R(ped.troco) : ""}<br>${ret ? "🏪 Retirada no local" + (loja.endereco ? ": " + esc(loja.endereco) : "") : "🛵 " + esc(ped.cliente.endereco)}</p>
    </div>
    <p style="text-align:center;margin-top:18px"><a href="${linkLoja(loja.slug)}" style="color:var(--cor);font-weight:700;text-decoration:none">← Voltar ao cardápio</a></p>
    <p style="text-align:center;color:var(--cinza);font-size:.78rem;margin-top:14px">Esta página atualiza sozinha.<br><a href="termos.html" style="color:var(--cinza)">Termos de Uso</a> · <a href="privacidade.html" style="color:var(--cinza)">Privacidade</a></p>`;
}
</script>
</body>
</html>
