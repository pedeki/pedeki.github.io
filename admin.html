<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração — Pedeki</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.nums .card{padding:16px}
.nums small{color:var(--cinza);font-weight:600;font-size:.78rem}
.nums strong{display:block;font-size:1.5rem;color:var(--escuro)}
@media(max-width:800px){.nums{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;color:var(--cinza);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;padding:10px;border-bottom:1px solid var(--linha)}
td{padding:12px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
td b{color:var(--escuro)}
.tab{overflow-x:auto}
.ff{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ff input{max-width:280px}
.ff button{border:1.5px solid var(--linha);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--cinza)}
.ff button.on{background:var(--escuro);color:#fff;border-color:var(--escuro)}
</style>
</head>
<body>
<div class="carregando" id="carregando"><div class="giro"></div></div>
<div class="wrap">
  <div class="topo"><div id="marca"></div><div style="display:flex;gap:8px"><a class="btn btn-sec btn-mini" href="painel.html">Meu painel</a><button class="btn btn-sec btn-mini" id="btSair">Sair</button></div></div>
  <div id="corpo"></div>
</div>
<div class="modal" id="mInfo"><div class="modal-box"><button class="fechar" data-fecha>✕</button><div id="infoCorpo"></div></div></div>
<script src="config.js"></script>
<script type="module">
import { auth, db, F, C, $, $$, R, esc, toast, fmtTel, ms, validoAte, lojaAtiva, emTeste, dataBR, diasRestantes, DIA, marcaHTML, linkLoja, erroAmigavel } from "./js/base.js";
$("#marca").innerHTML = marcaHTML;
$("#btSair").onclick = () => F.signOut(auth).then(() => location.href = "conta.html#entrar");
document.addEventListener("click", e => { if (e.target.closest("[data-fecha]") || e.target.classList.contains("modal")) e.target.closest(".modal")?.classList.remove("on"); });
let lojas = [], filtro = "todas", busca = "";
F.onAuthStateChanged(auth, u => {
  if (!u) return location.href = "conta.html#entrar";
  $("#carregando").remove();
  if (u.email !== C.adminEmail) { $("#corpo").innerHTML = `<div class="card vazio"><div class="ic">🔒</div><b>Área restrita</b><p>Só o administrador pode ver esta página.</p></div>`; return; }
  if (!u.emailVerified) $("#corpo").insertAdjacentHTML("beforebegin", `<div class="aviso amarelo" style="margin-bottom:14px">Confirme seu e-mail (link enviado no cadastro) para poder liberar dias manualmente. <button class="btn btn-sec btn-mini" id="btRe">Reenviar e-mail</button></div>`);
  $("#btRe")?.addEventListener("click", () => F.sendEmailVerification(u).then(() => toast("Enviado!")));
  F.onSnapshot(F.collection(db, "lojas"), s => {
    lojas = s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) })).sort((a, b) => ms(b.criadoEm) - ms(a.criadoEm));
    desenha();
  }, e => toast(erroAmigavel(e), "erro"));
});
function situacao(l) {
  if (!lojaAtiva(l)) return ["Vencida", "b-erro", "vencidas"];
  if (emTeste(l)) return ["Em teste", "b-novo", "teste"];
  return ["Pagante", "b-ok", "pagantes"];
}
function desenha() {
  const cont = { teste: 0, pagantes: 0, vencidas: 0 };
  lojas.forEach(l => cont[situacao(l)[2]]++);
  const lista = lojas.filter(l => (filtro === "todas" || situacao(l)[2] === filtro) && (!busca || (l.nome + " " + l.slug + " " + l.whatsapp).toLowerCase().includes(busca)));
  $("#corpo").innerHTML = `
  <div class="nums">
    <div class="card"><small>Lojas</small><strong>${lojas.length}</strong></div>
    <div class="card"><small>Em teste</small><strong>${cont.teste}</strong></div>
    <div class="card"><small>Pagantes</small><strong>${cont.pagantes}</strong></div>
    <div class="card"><small>Vencidas</small><strong>${cont.vencidas}</strong></div>
    <div class="card"><small>Receita/mês (estimada)</small><strong>${R(cont.pagantes * C.preco)}</strong></div>
  </div>
  <div class="card">
    <div class="ff"><input id="busca" placeholder="Buscar loja, link ou WhatsApp" value="${esc(busca)}">
      ${[["todas", "Todas"], ["teste", "Em teste"], ["pagantes", "Pagantes"], ["vencidas", "Vencidas"]].map(([k, n]) => `<button data-f="${k}" class="${filtro === k ? "on" : ""}">${n}</button>`).join("")}</div>
    <div class="tab"><table><thead><tr><th>Loja</th><th>WhatsApp</th><th>Criada</th><th>Situação</th><th>Válida até</th><th></th></tr></thead><tbody>
    ${lista.map(l => { const [n, c] = situacao(l), fim = validoAte(l); return `<tr>
      <td><b>${esc(l.nome)}</b><br><a href="${linkLoja(l.slug)}" target="_blank" style="color:var(--cinza);font-size:.8rem">/${esc(l.slug)}</a></td>
      <td><a href="https://wa.me/${esc(l.whatsapp)}" target="_blank">${esc(fmtTel(l.whatsapp))}</a></td>
      <td>${dataBR(ms(l.criadoEm))}</td><td><span class="badge ${c}">${n}</span></td>
      <td>${dataBR(fim)}${lojaAtiva(l) ? `<br><small style="color:var(--cinza)">${diasRestantes(fim)} dia(s)</small>` : ""}</td>
      <td style="white-space:nowrap"><button class="btn btn-sec btn-mini" data-info="${l.id}">Dados</button> <button class="btn btn-pri btn-mini" data-add="${l.id}" data-d="30">+30 dias</button></td></tr>`; }).join("") || '<tr><td colspan="6" style="text-align:center;color:var(--cinza)">Nenhuma loja.</td></tr>'}
    </tbody></table></div></div>`;
  $("#busca").oninput = e => { busca = e.target.value.toLowerCase(); const p = e.target.selectionStart; desenha(); $("#busca").focus(); $("#busca").setSelectionRange(p, p); };
  $$("[data-f]").forEach(b => b.onclick = () => { filtro = b.dataset.f; desenha(); });
}
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-add]"), i = e.target.closest("[data-info]");
  if (a) {
    const l = lojas.find(x => x.id === a.dataset.add), base = Math.max(Date.now(), validoAte(l));
    try { await F.updateDoc(F.doc(db, "lojas", l.id), { pagoAte: F.Timestamp.fromMillis(base + a.dataset.d * DIA) }); toast(`+${a.dataset.d} dias para ${l.nome}`); }
    catch (er) { toast(erroAmigavel(er), "erro"); }
  }
  if (i) {
    const l = lojas.find(x => x.id === i.dataset.info);
    let p = {}; try { p = (await F.getDoc(F.doc(db, "lojas", l.id, "privado", "dados"))).data() || {}; } catch {}
    let pags = []; try { pags = (await F.getDocs(F.query(F.collection(db, "pagamentos"), F.where("loja", "==", l.id)))).docs.map(d => d.data()); } catch {}
    $("#infoCorpo").innerHTML = `<h2>${esc(l.nome)}</h2>
      <div class="chave"><div><b>Dono</b><small>${esc(p.dono || "-")}</small></div></div>
      <div class="chave"><div><b>E-mail</b><small>${esc(p.email || "-")}</small></div></div>
      <div class="chave"><div><b>CPF</b><small>${esc(p.cpf || "-")}</small></div></div>
      <div class="chave"><div><b>Teste grátis</b><small>${l.testeDias ? l.testeDias + " dias" : "Não ganhou (WhatsApp/CPF repetido)"}</small></div></div>
      <div class="chave"><div><b>Pagamentos</b><small>${pags.length ? pags.map(x => `${R(x.valor)} em ${dataBR(ms(x.pagoEm))}`).join("<br>") : "Nenhum"}</small></div></div>
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-pri" data-add="${l.id}" data-d="30">+30 dias</button><button class="btn btn-sec" data-add="${l.id}" data-d="365">+1 ano</button></div>`;
    $("#mInfo").classList.add("on");
  }
});
</script>
</body>
</html>
