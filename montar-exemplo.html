const AD_PONTO = { nome: "Ponto da carne", min: 1, max: 1, opcoes: [{ nome: "Ao ponto", preco: 0 }, { nome: "Bem passada", preco: 0 }, { nome: "Mal passada", preco: 0 }] };
const PRODUTOS = [
  { nome: "X-Bacon Duplo", descricao: "2 carnes artesanais 150g, bacon crocante, cheddar cremoso e molho da casa no pão brioche.", categoria: "Lanches", preco: 29.9, precoDe: 34.9, foto: IMG["x-bacon"], adicionais: [AD_PONTO, AD_LANCHE] },
  { nome: "X-Salada Clássico", descricao: "Carne 150g, queijo prato, alface, tomate e maionese da casa.", categoria: "Lanches", preco: 22.9, foto: IMG["x-salada"], adicionais: [AD_PONTO, AD_LANCHE] },
  { nome: "Smash Burger", descricao: "2 smash de 80g bem tostadinhos, queijo derretido e cebola caramelizada.", categoria: "Lanches", preco: 26.9, foto: IMG["smash"], adicionais: [AD_LANCHE] },
  { nome: "Hot Dog Completo", descricao: "Salsicha, purê, vinagrete, milho, ervilha e batata palha.", categoria: "Lanches", preco: 16.9, foto: IMG["hotdog"], adicionais: [] },
  { nome: "Combo Casa", descricao: "X-Salada Clássico + batata frita média + refrigerante lata. Mata a fome de verdade!", categoria: "Combos", preco: 36.9, precoDe: 44.9, foto: IMG["combo"], adicionais: [{ nome: "Sabor do refri", min: 1, max: 1, opcoes: [{ nome: "Coca-Cola", preco: 0 }, { nome: "Guaraná", preco: 0 }, { nome: "Fanta Laranja", preco: 0 }] }] },
  { nome: "Batata com Cheddar e Bacon", descricao: "Porção de 400g de batata sequinha coberta com cheddar e bacon. Serve 2 pessoas.", categoria: "Porções", preco: 24.9, foto: IMG["batata"], adicionais: [] },

F.onAuthStateChanged(auth, async u => {
  if (!u) { $("#info").innerHTML = 'Entre primeiro com a conta da loja de exemplo: <a href="conta.html#entrar">Entrar</a>'; return; }
  const s = await F.getDoc(F.doc(db, "lojas", u.uid));
  if (!s.exists()) { $("#info").textContent = "Essa conta não tem loja."; return; }
  const l = s.data();
  if (l.slug !== C.lojaExemplo) { $("#info").innerHTML = `Você está na loja <b>${l.nome}</b> (/${l.slug}). Essa ferramenta só funciona na loja de exemplo (/${C.lojaExemplo}).`; return; }
  $("#info").innerHTML = `Loja: <b>/${l.slug}</b>. Vai virar a <b>Casa do Lanche</b> com logo, capa, 8 produtos com foto, adicionais, promoções, cupom <b>BEMVINDO</b> e entrega configurada.<br><small>Os produtos que já existem nela serão trocados.</small>`;
  $("#bt").classList.remove("oculto");
  $("#bt").onclick = async () => {
    const bt = $("#bt"); bt.disabled = true; bt.textContent = "Montando…";
    try {
      const velhos = await F.getDocs(F.collection(db, "lojas", u.uid, "produtos"));
      const b = F.writeBatch(db);
      velhos.docs.forEach(d => b.delete(F.doc(db, "lojas", u.uid, "produtos", d.id)));
      const horarios = {}; DIAS.forEach(d => horarios[d] = { on: true, ab: "11:00", fe: "23:30" });
      b.update(F.doc(db, "lojas", u.uid), {
        nome: "Casa do Lanche", descricao: "Hambúrguer artesanal feito na hora 🔥", logo: IMG.logo, capa: IMG.capa, cor: "#F2672A",
        endereco: "Rua das Flores, 120 - Centro", abertoModo: "aberto", horarios,
        entregaAtiva: true, taxaEntrega: 5, retiradaAtiva: true, pedidoMinimo: 15, tempoEntrega: "30–45 min",
        pagamentos: ["Pix", "Cartão", "Dinheiro"], categorias: ["Lanches", "Combos", "Porções", "Bebidas"], entregaConfigurada: true
      });
      PRODUTOS.forEach((p, i) => b.set(F.doc(F.collection(db, "lojas", u.uid, "produtos")), { ...p, precoDe: p.precoDe || null, estoque: null, ativo: true, ordem: 1000 + i }));
      b.set(F.doc(db, "lojas", u.uid, "cupons", "BEMVINDO"), { tipo: "pct", valor: 10, minimo: 0, ativo: true });
      await b.commit();
      bt.classList.add("oculto");
      $("#fim").classList.remove("oculto");
      $("#fim").innerHTML = `<div class="aviso verde" style="margin-bottom:12px">🎉 Loja de exemplo pronta!</div><a class="btn btn-pri btn-bloco" href="${linkLoja(l.slug)}">Ver a loja</a> <a class="btn btn-sec btn-bloco" style="margin-top:8px" href="painel.html">Ir para o painel</a>`;
    } catch (er) { toast(erroAmigavel(er), "erro"); bt.disabled = false; bt.textContent = "✨ Montar a loja agora"; }
  };
});
