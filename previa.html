<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Prévia do cardápio — Pedeki</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
body{background:#F7F5F2;padding-bottom:150px}
.wrap{max-width:760px;margin:0 auto}
.faixa{background:var(--escuro);color:#fff;text-align:center;font-size:.85rem;font-weight:600;padding:10px 14px;line-height:1.4}
.faixa b{color:#FFB547}
.capa{height:180px;background:linear-gradient(135deg,#2B1A12,#5A2E18 60%,var(--cor)) center/cover;position:relative}
.topo{background:#fff;margin:-46px 14px 0;border-radius:22px;padding:16px;position:relative;box-shadow:var(--sombra);display:flex;gap:14px;align-items:center}
.logo{width:74px;height:74px;border-radius:20px;object-fit:cover;background:var(--escuro);color:#FFB547;display:grid;place-items:center;font-weight:800;font-size:1.5rem;flex-shrink:0;border:3px solid #fff;margin-top:-34px;box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.topo h1{font-size:1.3rem;color:var(--escuro);letter-spacing:-.02em;line-height:1.15}
.topo p{color:var(--cinza);font-size:.86rem;margin-top:2px}
.infos{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0}
.infos span{background:#fff;border:1px solid var(--linha);border-radius:999px;padding:6px 11px;font-size:.78rem;font-weight:600;color:var(--texto)}
.cats{position:sticky;top:0;z-index:5;background:#F7F5F2;display:flex;gap:8px;overflow-x:auto;padding:14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{text-decoration:none;white-space:nowrap;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--linha);font-weight:700;font-size:.85rem;color:var(--cinza)}
.cats a.on{background:var(--escuro);border-color:var(--escuro);color:#fff}
.sec{padding:4px 14px 6px}
.sec h2{font-size:1.1rem;color:var(--escuro);margin:12px 0 10px}
.prod{background:#fff;border-radius:18px;padding:12px;display:flex;gap:12px;margin-bottom:10px;align-items:center;border:1px solid transparent;cursor:pointer;transition:border .15s}
.prod:hover{border-color:var(--linha)}
.prod .tx{flex:1;min-width:0}
.prod h3{font-size:.98rem;color:var(--escuro)}
.prod p{font-size:.82rem;color:var(--cinza);margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:800;color:var(--escuro)}
.pr s{color:var(--cinza);font-weight:500;font-size:.82rem;margin-left:5px}
.pr.cons{color:var(--cinza);font-weight:600;font-size:.85rem}
.ft{width:92px;height:92px;border-radius:14px;object-fit:cover;flex-shrink:0;background:#F3EFEA;display:grid;place-items:center;font-size:2rem}
.add{width:34px;height:34px;border-radius:11px;border:0;background:var(--cor);color:#fff;font-size:1.2rem;font-weight:800;flex-shrink:0;cursor:pointer}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,245,242,0),#F7F5F2 30%)}
.cta-in{max-width:732px;margin:0 auto;background:#fff;border-radius:22px;padding:14px;box-shadow:0 20px 50px -18px rgba(23,21,31,.45);display:flex;gap:12px;align-items:center}
.cta-in .tx{flex:1;min-width:0;font-size:.84rem;color:var(--cinza);line-height:1.35}
.cta-in .tx b{display:block;color:var(--escuro);font-size:.98rem}
.cta-in a{flex-shrink:0}
.rod{text-align:center;color:var(--cinza);font-size:.78rem;margin:26px 0 10px}
.rod b{color:var(--escuro)}
.dica{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--escuro);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:.88rem;max-width:90vw;width:max-content;text-align:center;transition:.3s;z-index:30}
.dica.on{opacity:1;transform:translate(-50%,0)}
.vazio{max-width:420px;margin:90px auto;text-align:center;padding:20px}
@media(max-width:520px){.cta-in{flex-direction:column;align-items:stretch;text-align:center}.cta-in a{justify-content:center}}
</style>
</head>
<body>
<div class="carregando" id="carregando"><div class="giro"></div></div>
<div id="app"></div>
<div class="dica" id="toast"></div>
<script src="config.js"></script>
<script>
// Página de PRÉVIA: mostra um cardápio de exemplo montado pela Pedeki para uma loja que ainda não é cliente.
// Lê o arquivo previas/<id>.json do próprio site. Não cria loja, não recebe pedido.
const ZAP_PEDEKI = "5582994012972";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const R = n => "R$ " + Number(n).toFixed(2).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const id = (new URLSearchParams(location.search).get("p") || "").replace(/[^a-z0-9-]/gi, "").slice(0, 80);
const img = u => !u ? "" : /^https?:\/\//.test(u) ? u : "previas/" + u.replace(/^\/+|^previas\//g, "");
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 3200); }
function falha(t) { $("#carregando")?.remove(); $("#app").innerHTML = `<div class="vazio"><div style="font-size:2.6rem">🔎</div><h2 style="margin:10px 0 6px;color:var(--escuro)">${t}</h2><p style="color:var(--cinza)">Fale com a gente para montar o seu cardápio.</p><a class="btn btn-zap" style="margin-top:16px" href="https://wa.me/${ZAP_PEDEKI}" target="_blank" rel="noopener">💬 Falar com a Pedeki</a></div>`; }

(async () => {
  if (!id) return falha("Prévia não encontrada");
  let d;
  try { const r = await fetch(`previas/${id}.json`, { cache: "no-cache" }); if (!r.ok) throw 0; d = await r.json(); }
  catch { return falha("Prévia não encontrada"); }
  if (d.expiraEm && new Date(d.expiraEm) < new Date()) return falha("Esta prévia expirou");
  const cor = /^#[0-9a-f]{6}$/i.test(d.cor || "") ? d.cor : "#FF5A1F";
  document.documentElement.style.setProperty("--cor", cor);
  document.title = `${d.nome} — Prévia do cardápio`;
  const cats = (d.categorias || []).filter(c => (c.produtos || []).length);
  const zapAtivar = `https://wa.me/${ZAP_PEDEKI}?text=${encodeURIComponent(`Olá! Vi a prévia do cardápio da *${d.nome}* e quero ativar. 🚀\n(prévia: ${id})`)}`;
  const ini = d.nome.split(/\s+/).map(p => p[0]).join("").slice(0, 2).toUpperCase();
  $("#app").innerHTML = `
  <div class="faixa">👀 Prévia do cardápio da <b>${esc(d.nome)}</b>, feita pela Pedeki</div>
  <div class="wrap">
    <div class="capa" ${d.capa ? `style="background-image:url('${esc(img(d.capa))}')"` : ""}></div>
    <div class="topo">
      ${d.logo ? `<img class="logo" src="${esc(img(d.logo))}" alt="">` : `<div class="logo">${esc(ini)}</div>`}
      <div style="min-width:0"><h1>${esc(d.nome)}</h1><p>${esc([d.tipo, [d.bairro, d.cidade].filter(Boolean).join(", ")].filter(Boolean).join(" · "))}</p></div>
    </div>
    <div class="infos"><span style="color:var(--verde)">● Aberto</span>${d.entrega === false ? "" : "<span>🛵 Entrega</span>"}${d.retirada === false ? "" : "<span>🏪 Retirada</span>"}<span>${esc(d.pagamentos || "💠 Pix · 💵 Dinheiro · 💳 Cartão")}</span></div>
    <nav class="cats" id="cats">${cats.map((c, i) => `<a href="#c${i}" class="${i ? "" : "on"}">${esc(c.nome)}</a>`).join("")}</nav>
    ${cats.map((c, i) => `<section class="sec" id="c${i}"><h2>${esc(c.nome)}</h2>${c.produtos.map(p => `
      <div class="prod" data-p>
        <div class="tx"><h3>${esc(p.nome)}</h3>${p.descricao ? `<p>${esc(p.descricao)}</p>` : ""}
          ${p.preco > 0 ? `<span class="pr">${R(p.preco)}${p.precoDe > p.preco ? `<s>${R(p.precoDe)}</s>` : ""}</span>` : `<span class="pr cons">Consulte</span>`}</div>
        ${p.foto ? `<img class="ft" src="${esc(img(p.foto))}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ft>🍽️</div>'">` : ""}
        <button class="add" aria-label="Adicionar">+</button>
      </div>`).join("")}</section>`).join("")}
    <div class="rod">Os preços e produtos desta prévia foram copiados das redes da loja e podem estar desatualizados.<br>Cardápio digital por <b>Pedeki</b></div>
  </div>
  <div class="cta"><div class="cta-in">
    <div class="tx"><b>✨ Este cardápio pode ser seu hoje</b>Seus clientes escolhem aqui e o pedido chega pronto no seu WhatsApp. Teste 7 dias grátis.</div>
    <a class="btn btn-zap" href="${zapAtivar}" target="_blank" rel="noopener">💬 Quero ativar</a>
  </div></div>`;
  $("#carregando")?.remove();
  document.addEventListener("click", e => {
    if (e.target.closest("[data-p]")) toast("🛒 No cardápio ativo, seu cliente adiciona ao carrinho e o pedido chega pronto no seu WhatsApp!");
  });
  // destaca a categoria visível
  const links = [...document.querySelectorAll("#cats a")];
  const obs = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id)); }
  }), { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll(".sec").forEach(s => obs.observe(s));
})();
</script>
</body>
</html>
