<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#17151F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedeki Entregador">
<link rel="manifest" href="entregador.webmanifest">
<link rel="apple-touch-icon" href="icones/entregador-192.png">
<link rel="icon" href="icones/entregador-192.png">
<title>Pedeki Entregador</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
body{background:#F4F1ED;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.topo{background:var(--escuro);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:30}
.topo .linha{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.topo .marca{color:#fff;font-size:1.15rem}
.topo .marca svg{width:30px;height:30px}
.topo .tag{background:rgba(255,255,255,.12);padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;margin-left:2px}
.topo .som{margin-left:auto;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:8px 12px;font-weight:700;font-size:.8rem;cursor:pointer}
.ola{color:#fff;max-width:560px;margin:12px auto 0;font-size:.9rem;opacity:.85}
.abas{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}
.abas button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.74rem;color:var(--cinza);cursor:pointer;padding:6px;border-radius:12px;position:relative}
.abas button span.i{font-size:1.35rem}
.abas button.on{color:var(--cor)}
.abas .bolinha{position:absolute;top:2px;right:28%;background:var(--vermelho);color:#fff;font-size:.65rem;border-radius:999px;padding:1px 6px}
.tela{display:none;padding-top:16px}.tela.on{display:block;animation:sobe .2s}
h2.t{font-size:1.25rem;color:var(--escuro);margin:4px 0 12px;letter-spacing:-.02em}
.resumo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.resumo .card{padding:12px;text-align:center}
.resumo small{color:var(--cinza);font-weight:600;font-size:.72rem}
.resumo strong{display:block;font-size:1.25rem;color:var(--escuro)}
.ent{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--linha)}
.ent.nova{border:2px solid var(--cor);animation:pulsa 1.6s infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--cor) 15%,transparent)}}
.ent-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ent-top b{font-size:1.05rem;color:var(--escuro)}
.ent-top .badge{margin-left:auto}
.lojinha{font-size:.78rem;font-weight:700;color:var(--cor);background:var(--cor-claro);padding:3px 9px;border-radius:999px}
.end{background:#FAF7F4;border-radius:14px;padding:12px;margin-bottom:10px}
.end .rua{font-weight:800;color:var(--escuro);font-size:1.02rem;line-height:1.3}
.end small{color:var(--cinza)}
.info{display:flex;justify-content:space-between;font-size:.88rem;padding:4px 0}
.info b{color:var(--escuro)}
.bts{display:grid;gap:8px;margin-top:12px}
.bts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-zap svg{width:18px;height:18px}
.btn-grande{padding:15px;font-size:1rem;border-radius:16px}
.hist{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid var(--linha)}
.hist .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;flex-shrink:0}
.hist .tx{flex:1;min-width:0}
.hist .tx b{display:block;color:var(--escuro);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .tx small{color:var(--cinza);font-size:.78rem}
.filtros{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.filtros button{border:1.5px solid var(--linha);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--cinza);white-space:nowrap}
.filtros button.on{background:var(--escuro);border-color:var(--escuro);color:#fff}
.perfil-top{text-align:center;padding:10px 0 18px}
.avatar{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,var(--cor),#FF8A3D);color:#fff;display:grid;place-items:center;font-size:2.2rem;font-weight:800;margin:0 auto 10px;box-shadow:0 10px 24px -10px var(--cor)}
.perfil-top h3{font-size:1.3rem;color:var(--escuro)}
.perfil-top p{color:var(--cinza)}
.convite{background:linear-gradient(140deg,#17151F,#3a1d10 70%,#FF5A1F);color:#fff;border-radius:24px;padding:22px;margin:16px 0;text-align:center}
.convite .ic{font-size:2.6rem}
.convite h2{font-size:1.3rem;margin:6px 0}
.convite p{opacity:.85;margin-bottom:14px}
.convite .btn{background:#fff;color:var(--cor)}
.entrar{padding-top:16px}
.entrar .card{padding:22px}
.entrar h2{font-size:1.4rem;color:var(--escuro);letter-spacing:-.02em}
.mini-abas{display:flex;background:#EFEAE5;border-radius:14px;padding:4px;margin:14px 0}
.mini-abas button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;font-weight:700;cursor:pointer;color:var(--cinza)}
.mini-abas button.on{background:#fff;color:var(--escuro)}
.instalar{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px dashed var(--cor);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.instalar .tx{flex:1;font-size:.88rem}
.instalar b{color:var(--escuro)}
</style>
</head>
<body>
<div class="carregando" id="carregando"><div class="giro"></div></div>

<header class="topo">
  <div class="linha"><span id="marca"></span><span class="tag">Entregador</span><button class="som oculto" id="btSom">🔕 Ativar som</button></div>
  <div class="ola" id="ola"></div>
</header>

<!-- SEM LOGIN -->
<main class="wrap entrar oculto" id="vEntrar">
  <div id="conviteFora"></div>
  <div class="card">
    <h2>Seja entregador Pedeki 🛵</h2>
    <p style="color:var(--cinza)">Receba as entregas das lojas direto no seu celular.</p>
    <div class="mini-abas"><button data-m="criar" class="on">Criar conta</button><button data-m="entrar">Já tenho conta</button></div>
    <form id="fCriar">
      <div class="campo"><label>Seu nome</label><input name="nome" required maxlength="50" autocomplete="name"></div>
      <div class="campo"><label>Seu WhatsApp</label><input name="tel" required inputmode="tel" placeholder="(00) 00000-0000"></div>
      <div class="campo"><label>Crie uma senha</label><input name="senha" type="password" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:.84rem;margin-bottom:14px;cursor:pointer;line-height:1.5"><input type="checkbox" name="aceite" required style="width:20px;height:20px;flex-shrink:0;accent-color:var(--cor)"><span>Tenho 18 anos ou mais e aceito os <a href="termos.html" target="_blank" style="color:var(--cor);font-weight:700">Termos de Uso</a> e a <a href="privacidade.html" target="_blank" style="color:var(--cor);font-weight:700">Política de Privacidade</a>.</span></label>
      <button class="btn btn-pri btn-bloco btn-grande">Criar minha conta</button>
    </form>
    <form id="fEntrar" class="oculto">
      <div class="campo"><label>Seu WhatsApp</label><input name="tel" required inputmode="tel" placeholder="(00) 00000-0000"></div>
      <div class="campo"><label>Senha</label><input name="senha" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-pri btn-bloco btn-grande">Entrar</button>
    </form>
  </div>
</main>

<!-- COM LOGIN -->
<main class="wrap oculto" id="vApp">
  <div id="conviteDentro"></div>
  <div class="instalar oculto" id="boxInstalar"><span style="font-size:1.6rem">📲</span><div class="tx"><b>Instale o app</b><br><span id="txInstalar">Fica na tela inicial do celular, igual um app.</span></div><button class="btn btn-pri btn-mini" id="btInstalar">Instalar</button></div>

  <section class="tela on" data-t="entregas">
    <div class="resumo">
      <div class="card"><small>Hoje</small><strong id="rHoje">0</strong></div>
      <div class="card"><small>Em andamento</small><strong id="rAnd">0</strong></div>
      <div class="card"><small>Taxas hoje</small><strong id="rTaxa">R$ 0</strong></div>
    </div>
    <div id="listaAtivas"></div>
  </section>

  <section class="tela" data-t="historico">
    <h2 class="t">Histórico</h2>
    <div class="filtros" id="filtros"></div>
    <div id="listaHist"></div>
  </section>

  <section class="tela" data-t="perfil">
    <div class="perfil-top"><div class="avatar" id="avatar"></div><h3 id="pNome"></h3><p id="pTel"></p></div>
    <div class="card"><h3>🏪 Lojas que você entrega</h3><div id="pLojas"></div></div>
    <div class="card">
      <h3>✏️ Meus dados</h3>
      <form id="fPerfil"><div class="campo"><label>Nome</label><input name="nome" required maxlength="50"></div><button class="btn btn-escuro btn-bloco">Salvar</button></form>
    </div>
    <button class="btn btn-perigo btn-bloco" id="btSair" style="margin-top:14px">Sair da conta</button>
    <p style="text-align:center;color:var(--cinza);font-size:.78rem;margin:16px 0">Pedeki Entregador · <a href="termos.html" style="color:var(--cinza)">Termos</a> · <a href="privacidade.html" style="color:var(--cinza)">Privacidade</a></p>
  </section>
</main>

<nav class="abas oculto" id="abas">
  <button data-ir="entregas" class="on"><span class="i">🛵</span>Entregas<span class="bolinha oculto" id="bNovas"></span></button>
  <button data-ir="historico"><span class="i">🕘</span>Histórico</button>
  <button data-ir="perfil"><span class="i">👤</span>Meu perfil</button>
</nav>

<script src="config.js"></script>
<script type="module">
import { auth, db, F, $, $$, R, esc, toast, soNum, zapNum, fmtTel, mascaraTel, zapLink, ms, dataBR, horaBR, erroAmigavel, marcaHTML } from "./js/base.js";

const ZAP_SVG = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.6-.1 1.1z"/></svg>`;
$("#marca").innerHTML = marcaHTML;
const emailDe = tel => zapNum(tel) + "@entregador.pedeki.app";
const codConvite = new URLSearchParams(location.search).get("c") || "";
let user, perfil = {}, entregas = [], lojasOk = {}, convite = null, filtro = "concluidas";

// ---------- instalar como app
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw-entregador.js").catch(() => {});
let promptInstalar = null;
const instalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptInstalar = e; if (!instalado()) $("#boxInstalar").classList.remove("oculto"); });
if (!instalado() && /iphone|ipad/i.test(navigator.userAgent)) { $("#boxInstalar").classList.remove("oculto"); $("#txInstalar").innerHTML = "Toque em <b>Compartilhar ⬆️</b> e depois em <b>Adicionar à Tela de Início</b>."; $("#btInstalar").classList.add("oculto"); }
$("#btInstalar").onclick = async () => { if (!promptInstalar) return toast("Use o menu do navegador → Instalar app"); promptInstalar.prompt(); await promptInstalar.userChoice.catch(() => {}); promptInstalar = null; $("#boxInstalar").classList.add("oculto"); };

// ---------- convite
async function carregaConvite() {
  if (!codConvite) return;
  try { const s = await F.getDoc(F.doc(db, "convites", codConvite)); convite = s.exists() ? { id: s.id, ...s.data() } : { invalido: true }; }
  catch { convite = { invalido: true }; }
}
function htmlConvite(logado) {
  if (!convite) return "";
  if (convite.invalido) return `<div class="aviso vermelho" style="margin-top:14px">Esse convite não existe ou foi apagado. Peça um novo link para a loja.</div>`;
  if (logado && lojasOk[convite.loja]) return `<div class="aviso verde" style="margin-top:14px">✅ Você já é entregador da <b>${esc(convite.lojaNome)}</b>.</div>`;
  if (convite.usado && convite.usadoPor !== user?.uid) return `<div class="aviso vermelho" style="margin-top:14px">Esse convite já foi usado. Peça um novo link para a <b>${esc(convite.lojaNome)}</b>.</div>`;
  return `<div class="convite"><div class="ic">🛵</div><h2>${esc(convite.lojaNome)}</h2><p>convidou você para ser entregador da loja.</p>
    ${logado ? '<button class="btn btn-bloco btn-grande" id="btAceitar">✓ Aceitar convite</button>' : '<p style="margin:0;font-weight:700">Crie sua conta (ou entre) aqui embaixo para aceitar 👇</p>'}</div>`;
}
async function aceitarConvite() {
  const bt = $("#btAceitar"); bt.disabled = true; bt.textContent = "Aceitando…";
  try {
    const b = F.writeBatch(db);
    b.update(F.doc(db, "convites", convite.id), { usado: true, usadoPor: user.uid });
    b.set(F.doc(db, "lojas", convite.loja, "entregadores", user.uid), { nome: perfil.nome, tel: perfil.tel, convite: convite.id, desde: F.serverTimestamp(), ativo: true });
    b.set(F.doc(db, "entregadores", user.uid), { nome: perfil.nome, tel: perfil.tel, lojas: { ...(perfil.lojas || {}), [convite.loja]: convite.lojaNome } });
    await b.commit();
    toast("🎉 Agora você é entregador da " + convite.lojaNome + "!");
    try { history.replaceState(null, "", location.pathname); } catch {}
    convite = null; $("#conviteDentro").innerHTML = "";
  } catch (er) { toast(erroAmigavel(er), "erro"); bt.disabled = false; bt.textContent = "✓ Aceitar convite"; }
}

// ---------- login / cadastro
$$(".mini-abas button").forEach(b => b.onclick = () => { $$(".mini-abas button").forEach(x => x.classList.toggle("on", x === b)); $("#fCriar").classList.toggle("oculto", b.dataset.m !== "criar"); $("#fEntrar").classList.toggle("oculto", b.dataset.m !== "entrar"); });
mascaraTel($("#fCriar").tel); mascaraTel($("#fEntrar").tel);
$("#fCriar").onsubmit = async e => {
  e.preventDefault(); const f = e.target, tel = zapNum(f.tel.value), nome = f.nome.value.trim();
  if (tel.length < 12) return toast("Digite o WhatsApp com DDD.", "erro");
  const bt = f.querySelector("button"); bt.disabled = true;
  try {
    const u = (await F.createUserWithEmailAndPassword(auth, emailDe(tel), f.senha.value)).user;
    await F.setDoc(F.doc(db, "entregadores", u.uid), { nome, tel, lojas: {} });
  } catch (er) { toast(er.code === "auth/email-already-in-use" ? "Esse WhatsApp já tem conta. Toque em 'Já tenho conta'." : erroAmigavel(er), "erro"); bt.disabled = false; }
};
$("#fEntrar").onsubmit = async e => {
  e.preventDefault(); const f = e.target, bt = f.querySelector("button"); bt.disabled = true;
  try { await F.signInWithEmailAndPassword(auth, emailDe(f.tel.value), f.senha.value); }
  catch (er) { toast(er.code === "auth/invalid-credential" ? "WhatsApp ou senha errados." : erroAmigavel(er), "erro"); bt.disabled = false; }
};
$("#btSair").onclick = () => F.signOut(auth).then(() => location.reload());

// ---------- app
let parar = [];
F.onAuthStateChanged(auth, async u => {
  parar.forEach(f => f()); parar = [];
  await carregaConvite();
  $("#carregando")?.remove();
  if (!u || !u.email || !u.email.endsWith("@entregador.pedeki.app")) {
    if (u) await F.signOut(auth);
    user = null;
    $("#vEntrar").classList.remove("oculto"); $("#vApp").classList.add("oculto"); $("#abas").classList.add("oculto"); $("#btSom").classList.add("oculto");
    $("#conviteFora").innerHTML = htmlConvite(false); $("#ola").textContent = "";
    return;
  }
  user = u;
  $("#vEntrar").classList.add("oculto"); $("#vApp").classList.remove("oculto"); $("#abas").classList.remove("oculto"); $("#btSom").classList.remove("oculto");
  parar.push(F.onSnapshot(F.doc(db, "entregadores", u.uid), async s => {
    perfil = s.data() || { nome: "", tel: u.email.split("@")[0], lojas: {} };
    lojasOk = {};
    await Promise.all(Object.keys(perfil.lojas || {}).map(async l => { try { const m = await F.getDoc(F.doc(db, "lojas", l, "entregadores", u.uid)); if (m.exists()) lojasOk[l] = perfil.lojas[l]; } catch {} }));
    desenhaPerfil();
    $("#conviteDentro").innerHTML = htmlConvite(true);
    $("#btAceitar")?.addEventListener("click", aceitarConvite);
  }));
  let primeira = true;
  parar.push(F.onSnapshot(F.query(F.collection(db, "entregas"), F.where("entregadorUid", "==", u.uid)), s => {
    const antes = new Set(entregas.filter(x => x.status === "enviado").map(x => x.id));
    entregas = s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) })).sort((a, b) => ms(b.criadoEm) - ms(a.criadoEm));
    const novas = entregas.filter(x => x.status === "enviado" && !antes.has(x.id));
    if (!primeira && novas.length) { tocar(); toast("🔔 Nova entrega da " + novas[0].lojaNome + "!"); try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch {} ir("entregas"); }
    primeira = false;
    desenhaEntregas(); desenhaHistorico();
  }, er => toast(erroAmigavel(er), "erro")));
});

function ir(t) { $$(".tela").forEach(x => x.classList.toggle("on", x.dataset.t === t)); $$(".abas button").forEach(x => x.classList.toggle("on", x.dataset.ir === t)); scrollTo(0, 0); }
$$(".abas button").forEach(b => b.onclick = () => ir(b.dataset.ir));

function desenhaPerfil() {
  const n = perfil.nome || "Entregador";
  $("#ola").textContent = "Olá, " + n.split(" ")[0] + " 👋" + (Object.keys(lojasOk).length ? " · " + Object.values(lojasOk).join(", ") : "");
  $("#avatar").textContent = n.trim().slice(0, 1).toUpperCase();
  $("#pNome").textContent = n; $("#pTel").textContent = fmtTel(perfil.tel);
  $("#fPerfil").nome.value = n;
  const ls = Object.entries(lojasOk);
  $("#pLojas").innerHTML = ls.length ? ls.map(([, nome]) => `<div class="chave"><div><b>${esc(nome)}</b><small>Ativo</small></div><span class="badge b-ok">✓</span></div>`).join("")
    : '<p style="color:var(--cinza)">Você ainda não está em nenhuma loja. Peça o <b>link de convite</b> para a loja onde você trabalha.</p>';
}
$("#fPerfil").onsubmit = async e => {
  e.preventDefault(); const nome = e.target.nome.value.trim(); if (!nome) return;
  try {
    const b = F.writeBatch(db);
    b.update(F.doc(db, "entregadores", user.uid), { nome });
    Object.keys(lojasOk).forEach(l => b.update(F.doc(db, "lojas", l, "entregadores", user.uid), { nome }));
    await b.commit(); toast("Salvo!");
  } catch (er) { toast(erroAmigavel(er), "erro"); }
};

const ST = { enviado: ["Nova entrega", "b-novo", "🔔"], aceito: ["Aceita", "b-prep", "✅"], saiu: ["A caminho", "b-prep", "🛵"], chegou: ["No local", "b-ok", "📍"], entregue: ["Entregue", "b-ok", "🎉"], recusado: ["Recusada", "b-cinza", "↩️"], cancelado: ["Cancelada", "b-erro", "✕"] };
const ATIVAS = ["enviado", "aceito", "saiu", "chegou"];
function desenhaEntregas() {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const ent = entregas.filter(x => x.status === "entregue" && ms(x.atualizadoEm || x.criadoEm) >= hoje.getTime());
  const ativas = entregas.filter(x => ATIVAS.includes(x.status));
  $("#rHoje").textContent = ent.length; $("#rAnd").textContent = ativas.length;
  $("#rTaxa").textContent = R(ent.reduce((s, x) => s + (x.taxa || 0), 0)).replace(",00", "");
  const novas = entregas.filter(x => x.status === "enviado").length;
  $("#bNovas").textContent = novas; $("#bNovas").classList.toggle("oculto", !novas);
  if (!ativas.length) {
    $("#listaAtivas").innerHTML = `<div class="card vazio"><div class="ic">🛵</div><b>Nenhuma entrega agora</b><p>Quando a loja te mandar uma entrega, ela aparece aqui${somLigado ? "" : "<br>Toque em <b>Ativar som</b> lá em cima para ouvir o aviso"}.</p></div>`;
    return;
  }
  $("#listaAtivas").innerHTML = ativas.map(x => {
    const [stN, stC] = ST[x.status];
    let ac = "";
    if (x.status === "enviado") ac = `<div class="bts2"><button class="btn btn-perigo btn-grande" data-a="recusar" data-id="${x.id}">Recusar</button><button class="btn btn-pri btn-grande" data-a="aceitar" data-id="${x.id}">✓ Aceitar</button></div>`;
    if (x.status === "aceito") ac = `<button class="btn btn-pri btn-bloco btn-grande" data-a="saiu" data-id="${x.id}">🛵 Saí para entrega</button>`;
    if (x.status === "saiu") ac = `<button class="btn btn-escuro btn-bloco btn-grande" data-a="chegou" data-id="${x.id}">📍 Cheguei</button>`;
    if (x.status === "chegou") ac = `<button class="btn btn-pri btn-bloco btn-grande" style="background:var(--verde)" data-a="entregue" data-id="${x.id}">✓ Confirmar entrega</button>`;
    const mostra = x.status !== "enviado";
    return `<div class="ent ${x.status === "enviado" ? "nova" : ""}">
      <div class="ent-top"><span class="lojinha">${esc(x.lojaNome)}</span><b>#${x.numero}</b><span class="badge ${stC}">${stN}</span></div>
      <div class="end"><small>📍 Entregar em</small><div class="rua">${esc(x.cliente.endereco)}</div><small>${esc(x.cliente.nome)} · ${horaBR(ms(x.criadoEm))}</small></div>
      <div class="info"><span>Itens</span><b>${(x.itens || []).length} item(ns)</b></div>
      <div class="info"><span>Cobrar do cliente</span><b>${R(x.total)} · ${esc(x.pagamento)}</b></div>
      ${x.troco ? `<div class="info"><span>Levar troco para</span><b>${R(x.troco)}</b></div>` : ""}
      <div class="info"><span>Sua taxa</span><b style="color:var(--verde)">${R(x.taxa || 0)}</b></div>
      ${x.obs ? `<div class="aviso amarelo" style="margin-top:8px;font-size:.84rem">📝 ${esc(x.obs)}</div>` : ""}
      <div class="bts">
        ${mostra ? `<div class="bts2"><a class="btn btn-sec" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.cliente.endereco)}">🗺️ Ver no mapa</a><a class="btn btn-zap" target="_blank" href="${zapLink(x.cliente.tel, "Olá, " + x.cliente.nome.split(" ")[0] + "! Sou o entregador da " + x.lojaNome + ", sobre seu pedido #" + x.numero + ".")}">${ZAP_SVG} Cliente</a></div>` : ""}
        ${ac}
      </div></div>`;
  }).join("");
}
const FILTROS = [["concluidas", "Entregues", x => x.status === "entregue"], ["recusadas", "Recusadas", x => x.status === "recusado"], ["canceladas", "Canceladas", x => x.status === "cancelado"], ["todas", "Todas", x => !ATIVAS.includes(x.status)]];
function desenhaHistorico() {
  $("#filtros").innerHTML = FILTROS.map(([k, n, f]) => `<button class="${filtro === k ? "on" : ""}" data-f="${k}">${n} ${entregas.filter(f).length}</button>`).join("");
  $$("#filtros button").forEach(b => b.onclick = () => { filtro = b.dataset.f; desenhaHistorico(); });
  const l = entregas.filter(FILTROS.find(f => f[0] === filtro)[2]);
  $("#listaHist").innerHTML = l.length ? l.map(x => { const [n, c, i] = ST[x.status]; return `<div class="hist"><div class="ic" style="background:${x.status === "entregue" ? "var(--verde-claro)" : "#F1EEEA"}">${i}</div><div class="tx"><b>#${x.numero} · ${esc(x.cliente.nome)}</b><small>${esc(x.lojaNome)} · ${dataBR(ms(x.criadoEm))} ${horaBR(ms(x.criadoEm))}</small></div><div style="text-align:right"><span class="badge ${c}">${n}</span><br><small style="color:var(--cinza)">${R(x.taxa || 0)}</small></div></div>`; }).join("")
    : `<div class="card vazio"><div class="ic">🕘</div>Nada por aqui ainda.</div>`;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const x = entregas.find(y => y.id === b.dataset.id); if (!x) return;
  const a = b.dataset.a;
  const nome = x.cliente.nome.split(" ")[0], eu = (perfil.nome || "").split(" ")[0];
  const msgs = {
    saiu: `Olá, ${nome}! 😄 Sou ${eu}, entregador da *${x.lojaNome}*. Seu pedido *#${x.numero}* saiu para entrega! 🛵`,
    chegou: `${nome}, cheguei com seu pedido *#${x.numero}* da *${x.lojaNome}*! 📍 Estou aqui na frente.`
  };
  if (msgs[a]) window.open(zapLink(x.cliente.tel, msgs[a]), "_blank");
  const novo = { aceitar: "aceito", recusar: "recusado", saiu: "saiu", chegou: "chegou", entregue: "entregue" }[a];
  b.disabled = true;
  try {
    const bt = F.writeBatch(db);
    bt.update(F.doc(db, "entregas", x.id), { status: novo, atualizadoEm: F.serverTimestamp() });
    if (a === "saiu") bt.update(F.doc(db, "lojas", x.loja, "pedidos", x.pedidoId), { status: "entrega" });
    if (a === "entregue") bt.update(F.doc(db, "lojas", x.loja, "pedidos", x.pedidoId), { status: "concluido" });
    await bt.commit();
    toast({ aceitar: "Entrega aceita! ✅", recusar: "Entrega recusada", saiu: "Boa entrega! 🛵", chegou: "Avisamos o cliente 📍", entregue: "Entrega concluída! 🎉" }[a]);
  } catch (er) { toast(erroAmigavel(er), "erro"); b.disabled = false; }
});

// ---------- som
let audio = null, somLigado = false;
$("#btSom").onclick = () => { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); somLigado = true; $("#btSom").textContent = "🔔 Som ligado"; tocar(); } catch {} };
function tocar() {
  if (!somLigado || !audio) return;
  [0, .2, .4, .8, 1, 1.2].forEach((t, i) => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = [880, 1100, 1320][i % 3]; g.gain.setValueAtTime(.0001, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.5, audio.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + t + .17); o.connect(g).connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .19); });
}
</script>
